    <script>
      // Apply the saved appearance before first paint so there is no theme flash.
      (function () {
        try {
          var a = JSON.parse(localStorage.getItem('evolve:appearance') || '{}');
          var t = a.theme || 'dark';
          var dark = t === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : t !== 'light';
          var r = document.documentElement;
          r.classList.toggle('dark', dark);
          r.classList.toggle('light', !dark);
          if (a.accent) r.setAttribute('data-accent', a.accent);
          if (a.highContrast) r.classList.add('hc');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#06070a' : '#f2f3f7');
        } catch (e) {}
      })();
    </script>
